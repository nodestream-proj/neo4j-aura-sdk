                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
                  customer_managed_key_id: UUID_OF_YOUR_KEY
  /instances/sizing:
    post:
      summary: Estimate the size of a new instance
      tags:
        - instances
      operationId: post-instances-sizing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recommended_size:
                        type: string
                        description: The recommended instance size.
                      min_required_memory:
                        type: string
                        description: The minimum required memory for the instance.
                      did_exceed_maximum:
                        type: boolean
                        description: Indicates if the instance size exceeds the maximum allowed.
                    required:
                      - did_exceed_maximum
                      - min_required_memory
                      - recommended_size
              examples:
                Sizing details:
                  value:
                    data:
                      did_exceed_maximum: false
                      min_required_memory: 14GB
                      recommended_size: 16GB
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |-
          This endpoint estimates the size of a new instance based on the provided configuration.
          Supported instance types are `enterprise-ds`, and `professional-ds`, depending on your project configuration.

          The recommended size can can be used to create an instance using POST `/instances`.

          The response includes the recommended instance size, the minimum required memory for the instance, and a boolean value indicating if the instance size exceeds the maximum allowed by your Aura project instance configuration.

          This endpoint requires the `Content-Type: application/json` header to be set.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_count:
                  type: integer
                  description: The number of nodes to be stored in the instance.
                relationship_count:
                  type: integer
                  description: The number of relationships to be stored in the instance.
                instance_type:
                  $ref: '#/components/schemas/InstanceType'
                algorithm_categories:
                  type: array
                  items:
                    type: string
                  description: The algorithm categories to be used in the instance.
              required:
                - node_count
                - relationship_count
            examples:
              Estimate the size of a new professional-ds instance:
                value:
                  node_count: 1000000
                  relationship_count: 5000000
                  instance_type: "professional-ds"
                  algorithm_categories:
                    - pathfinding
                    - community-detection
              Estimate the size of a new enterprise-ds instance:
                value:
                  node_count: 1000000
                  relationship_count: 5000000
                  instance_type: "enterprise-ds"
                  algorithm_categories:
                    - node-embedding
  '/instances/{instanceId}':
    parameters:
      - $ref: '#/components/parameters/instanceId'
    get:
      summary: Returns instance details
      tags:
        - instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              examples:
                Instance details:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      metrics_integration_url: YOUR_METRICS_INTEGRATION_ENDPOINT
                      region: europe-west1
                      type: enterprise-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: false
                Instance details with CMK:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      region: europe-west1
                      type: enterprise-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      customer_managed_key_id: UUID_OF_YOUR_KEY
                Instance details configured with vector optimization and the Graph Analytics plugin:
                  value:
                    data:
                    id: 2f49c2b3
                    name: Production
                    status: running
                    tenant_id: YOUR_TENANT_ID
                    cloud_provider: gcp
                    connection_url: YOUR_CONNECTION_URL
                    region: europe-west1
                    type: professional-db
                    memory: 8GB
                    storage: 16GB
                    created_at: '2023-01-20T13:44:42Z'
                    vector_optimized: true
                    graph_analytics_plugin: true
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          links:
            PauseInstance:
              operationId: pause-instance-id
              parameters:
                instanceId: $response.body#/data/id
            ResumeInstance:
              operationId: resume-instance-id
              parameters:
                instanceId: $response.body#/data/id
            DestroyInstance:
              operationId: delete-instance-id
              parameters:
                instanceId: $response.body#/data/id
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InstanceNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      operationId: get-instance-id
      description: This endpoint returns details about a specific Aura Instance.
    delete:
      summary: Deletes an instance
      tags:
        - instances
      operationId: delete-instance-id
      responses:
        '202':
          description: Instance is being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              examples:
                Instance details:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: deleting
                      connection_url: YOUR_CONNECTION_URL
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      memory: 8GB
                      storage: 16GB
                      region: europe-west1
                      type: enterprise-db
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: false
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InstanceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |-
        Starts the deletion process of an Aura instance.

        Deleting an instance is an asynchronous operation. You can poll the current status of this operation by periodically getting the instance details for the instance ID using the GET /instances/{instanceId} endpoint.

        If another operation is being performed on the instance you are trying to delete, a 409 Conflict HTTP response code will be returned that indicates that deletion cannot be performed. As deletion is an asynchronous operation, the endpoint returns a 202 Accepted HTTP response code.

        As DELETE is an idempotent HTTP method it is safe to retry or send duplicate requests. However, the server will only reply at most once with a successful deletion response (202 Accepted) and will respond with error status codes for any other requests (most likely with 404 Not Found). We suggest treating either 202 or 404 as signs of completion when retrying requests to this endpoint.

        Warning: There is no way to recover data from a deleted Aura instance.
    patch:
      summary: Edits the instance configuration
      description: |-
        This endpoint allows you to rename and resize an Aura instance.

        Resizing an instance is an asynchronous operation. The instance remains available throughout.

        This endpoint requires the `Content-Type: application/json` header to be set.
      tags:
        - instances
      operationId: patch-instance-id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: |-
                    Edit the instance name in the Aura Console.

                    The name may include any UTF-8 characters with no trailing or leading whitespace.
                  example: Instance01
                  maxLength: 30
                  minLength: 1
                memory:
                  $ref: '#/components/schemas/InstanceMemory'
                vector_optimized:
                  type: boolean
                  description: Add or remove the instance vector optimization.
                graph_analytics_plugin:
                  type: boolean
                  description: Add or remove the instance graph analytics plugin.
                storage:
                  $ref: '#/components/schemas/InstanceStorage'
            examples:
              Rename the instance:
                value:
                  name: Instance02
              Resize the instance:
                value:
                  memory: 16GB
                  storage: 32GB
