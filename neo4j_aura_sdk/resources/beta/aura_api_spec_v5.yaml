      description: |-
        This endpoint creates a new Customer Managed Key in Aura. Creating a new key is an asynchronous operation.

        Before you can use the key you will need to setup permissions for it. Log in to the Console, navigate to 'Customer Managed Keys' and click on the Edit icon next to the Key in order to see the instructions.

        You can poll the current status of this operation by periodically getting the key details using the GET `/customer-managed-keys/{customerManagedKeyId}` endpoint.

        Once the key has a status of `ready` you can use it for creating new instances by setting the `customer_managed_key_id` field.

