openapi: 3.0.0
info:
  title: Aura API
  version: v1beta5
  description: |-
    This is the v1beta5 release of the Aura API that allows you to programmatically provision and manage your Aura instances. 

    For more information on how to use the API, see the [Aura API documentation](https://neo4j.com/docs/aura/api/overview/).

    [Provide feedback](https://docs.google.com/forms/d/e/1FAIpQLSfNZMyQRnI_ZzK8IJ2E266DP_-zLDBWzk1OaUkPem16V-ekZQ/viewform) on the Aura API.
  termsOfService: 'https://console.neo4j.io/#terms'
tags:
  - name: instances
    description: Relates to AuraDB or AuraDS instances.
  - name: projects
    description: Relates to an Aura project.
  - name: customer managed keys
    description: Relates to Customer Managed Keys.
  - name: data apis
    description: Relates to Data APIs.
servers:
  - url: 'https://api.neo4j.io/v1beta5'
    description: Aura API v1beta5
paths:
  /instances:
    parameters: []
    get:
      summary: Returns a list of instances
      tags:
        - instances
      operationId: get-instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstanceSummary'
                required:
                  - data
              examples:
                List of Aura instances:
                  value:
                    data:
                      - id: 2f49c2b3
                        name: Production
                        tenant_id: YOUR_PROJECT_ID
                        cloud_provider: gcp
                        created_at: '2023-01-20T13:44:42Z'
                      - id: b51dc964
                        name: Instance01
                        tenant_id: YOUR_PROJECT_ID
                        cloud_provider: aws
                        created_at: '2023-01-20T13:44:42Z'
                      - id: 432392ae
                        name: Recommendations
                        tenant_id: YOUR_PROJECT_ID
                        cloud_provider: azure
                        created_at: '2023-01-20T13:44:42Z'
                      - id: 524b7d8d
                        name: Northwind
                        tenant_id: YOUR_PROJECT_ID
                        cloud_provider: gcp
                        created_at: '2023-01-20T13:44:42Z'
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |- 
        This endpoint returns a list containing a summary of each of your Aura instances. To find out more about a specific instance, retrieve the details using the GET /instances/{instanceId} endpoint.

        You can filter instances in a particular project using GET /instances?tenantId={tenantId}. If the `tenantId`(project) query parameter is not specified, this endpoints lists all intances a user has access to across all projects.
      parameters:
        - $ref: '#/components/parameters/tenantIdOptional'
    post:
      summary: Creates a new instance
      tags:
        - instances
      operationId: post-instances
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The instance ID.
                      connection_url:
                        type: string
                        description: The URL to connect to the Neo4j instance with.
                      username:
                        type: string
                        example: neo4j
                        description: The initial username for authenticating with this instance.
                      password:
                        type: string
                        description: The initial password for authenticating with this instance.
                      tenant_id:
                        type: string
                        description: The ID for the project.
                      cloud_provider:
                        $ref: '#/components/schemas/CloudProvider'
                      region:
                        $ref: '#/components/schemas/InstanceRegion'
                      name:
                        type: string
                        description: Name of the instance
                      type:
                        $ref: '#/components/schemas/InstanceType'
                      created_at:
                        type: string
                        description: The timestamp when the instance was created.
                      vector_optimized:
                        type: boolean
                        description: The vector optimization configuration when the instance was created.
                      graph_analytics_plugin:
                        type: boolean
                        description: The graph analytics plugin configuration when the instance was created.
                    required:
                      - id
                      - connection_url
                      - username
                      - password
                      - tenant_id
                      - cloud_provider
                      - region
                      - type
                      - name
                      - created_at
              examples:
                Instance being created:
                  value:
                    data:
                      id: db1d1234
                      connection_url: YOUR_CONNECTION_URL
                      username: neo4j
                      password: letMeIn123!
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      region: europe-west1
                      type: enterprise-db
                      name: Instance01
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: false
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          links:
            GetInstanceDetails:
              operationId: get-instance-id
              parameters:
                instanceId: $response.body#/data/id
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '400':
          description: The request body contains malformed syntax, or is otherwise invalid. Please check and adjust the request before attempting to send it again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Missing Billing Information for self-serve users:
                  value:
                    errors:
                      - message: You must provide billing details in the Aura Console before creating an instance
                        reason: missing-billing-details
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: 'Creating instances is not permitted at this time, probably due to hitting a maximum instances limit. Check the error response body for details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |-
        This endpoint starts the creation process of an Aura instance.

        Creating an instance is an asynchronous operation. Supported instance configurations for your project can be obtained by calling the GET `/tenants/{tenantId}` endpoint. 

        Instance creation typically takes a few minutes, but can occasionally take up to 10 minutes. Wait until the instance is active in the Aura Console before connecting.

        You can poll the current status of this operation by periodically getting the instance details for the instance ID using the GET `/instances/{instanceId}` endpoint. Once the status transitions from "creating" to "running" you may begin to use your instance.

        This endpoint returns your instance ID, initial credentials, connection URL along with your project id, cloud provider, region, instance type, and the instance name in the response body for you to use once the instance is running. It is important to store these initial credentials until you have the chance to login to your running instance and change them.

        You must also provide a {cloud_provider} field in the request body, which specifies which cloud provider the instances will be hosted in. The acceptable values for this field are `gcp`, `aws`, or `azure`.

        For Enterprise instances you can specify a `customer_managed_key_id` to use a Customer Managed Key for encryption.

        General note: As of January 29, 2025, instances created specifying `"version": "5"` will be provisioned using the latest Neo4j calendar version format.

        This endpoint requires the `Content-Type: application/json` header to be set.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  $ref: '#/components/schemas/InstanceVersion'
                region:
                  $ref: '#/components/schemas/InstanceRegion'
                memory:
                  $ref: '#/components/schemas/InstanceMemory'
                storage:
                  $ref: '#/components/schemas/InstanceStorage'
                name:
                  type: string
                  example: Instance01
                  maxLength: 30
                  minLength: 1
                  description: The name of the instance (any UTF-8 characters with no trailing or leading whitespace).
                type:
                  $ref: '#/components/schemas/InstanceType'
                tenant_id:
                  type: string
                  description: The ID for the project.
                source_instance_id:
                  type: string
                  example: db1d1234
                  description: The ID of the source instance when cloning.
                source_snapshot_id:
                  type: string
                  description: An optional snapshot ID to create an instance from a specific snapshot. `source_instance_id` must also be provided.
                cloud_provider:
                  $ref: '#/components/schemas/CloudProvider'
                customer_managed_key_id:
                  type: string
                  description: An optional customer managed key to be used for instance creation.
                vector_optimized:
                  type: boolean
                  description: An optional vector optimization configuration to be set during instance creation.
                graph_analytics_plugin:
                  type: boolean
                  description: An optional graph analytics plugin configuration to be set during instance creation.
              required:
                - version
                - region
                - memory
                - name
                - type
                - tenant_id
                - cloud_provider
            examples:
              Creates an AuraDB Free Instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 1GB
                  name: Instance01
                  type: free-db
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDB Virtual Dedicated Cloud instance:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance01
                  type: enterprise-db
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDS Enterprise instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: enterprise-ds
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDB Business Critical instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: business-critical
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDB Professional instance:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance01
                  type: professional-db
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDB Professional instance with vector optimization configured:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 4GB
                  name: Instance01
                  type: professional-db
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
                  vector_optimized: true
              Creates an AuraDB Professional instance with the Graph Analytics plugin:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 4GB
                  name: Instance01
                  type: professional-db
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
                  graph_analytics_plugin: true
              Creates an AuraDS Professional instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: professional-ds
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Virtual Dedicated Cloud instance:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: enterprise-db
                  source_instance_id: db1d1234
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Virtual Dedicated Cloud instance from a snapshot:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: enterprise-db
                  source_instance_id: db1d1234
                  source_snapshot_id: 3e5e6e27-bf0a-4898-abb8-5f3050cac418
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDS Enterprise instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: enterprise-ds
                  source_instance_id: db1d1234
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDS Enterprise instance from a snapshot:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: enterprise-ds
                  source_instance_id: db1d1234
                  source_snapshot_id: 3e5e6e27-bf0a-4898-abb8-5f3050cac418
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Business Critical instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: business-critical
                  source_instance_id: db1d1234
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Business Critical instance from a snapshot:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: business-critical
                  source_instance_id: db1d1234
                  source_snapshot_id: 3e5e6e27-bf0a-4898-abb8-5f3050cac418
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Professional instance:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: professional-db
                  source_instance_id: db1d1234
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDB Professional instance from a snapshot:
                value:
                  version: '4'
                  region: europe-west1
                  memory: 4GB
                  storage: 8GB
                  name: Instance02
                  type: professional-db
                  source_instance_id: db1d1234
                  source_snapshot_id: 3e5e6e27-bf0a-4898-abb8-5f3050cac418
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDS Professional instance:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: professional-ds
                  source_instance_id: db1d1234
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Clones to a new AuraDS Professional instance from a snapshot:
                value:
                  version: '5'
                  region: europe-west1
                  memory: 8GB
                  storage: 16GB
                  name: Instance02
                  type: professional-ds
                  source_instance_id: db1d1234
                  source_snapshot_id: 3e5e6e27-bf0a-4898-abb8-5f3050cac418
                  tenant_id: YOUR_PROJECT_ID
                  cloud_provider: gcp
              Creates an AuraDB Virtual Dedicated Cloud instance with Customer Managed Key:
                value:
                  version: '5'
