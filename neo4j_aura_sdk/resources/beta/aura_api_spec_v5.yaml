components:
  schemas:
    Project:
      type: object
      description: Describes an Aura project.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - name
            - instance_configurations
          properties:
            id:
              type: string
              description: The id of the project
            name:
              type: string
              description: The name of the project
            instance_configurations:
              type: array
              description: A list of instance configurations that are supported by the project
              items:
                type: object
                description: A configuration for an instance
                required:
                  - region
                  - region_name
                  - type
                  - version
                  - memory
                  - cloud_provider
                properties:
                  region:
                    $ref: '#/components/schemas/InstanceRegion'
                  region_name:
                    type: string
                    description: A human-friendly name for the region
                  type:
                    $ref: '#/components/schemas/InstanceType'
                  memory:
                    $ref: '#/components/schemas/InstanceMemory'
                  version:
                    $ref: '#/components/schemas/InstanceVersion'
                  cloud_provider:
                    $ref: '#/components/schemas/CloudProvider'
    ProjectSummary:
      type: object
      description: 'Summary of an Aura project details, as returned in the get projects endpoint.'
      properties:
        id:
          type: string
          description: The id of the project
        name:
          type: string
          description: The name of the project
      required:
        - id
        - name
    Instance:
      type: object
      description: Describes an Aura instance.
      properties:
        data:
          type: object
          required:
            - id
            - name
            - status
            - connection_url
            - cloud_provider
            - tenant_id
            - memory
            - region
            - type
            - created_at
          properties:
            id:
              type: string
              description: The id of the instance
            name:
              type: string
              description: The name of the instance
            status:
              type: string
              description: The status of the instance
              enum:
                - creating
                - destroying
                - running
                - pausing
                - paused
                - suspending
                - suspended
                - resuming
                - loading
                - loading failed
                - restoring
                - updating
                - overwriting
            connection_url:
              type: string
              description: URL for connecting to the Neo4j instance
            created_at:
              type: string
              description: The timestamp when the instance was created
            metrics_integration_url:
              type: string
              description: Metrics integration endpoint URL for the Neo4j instance
            region:
              $ref: '#/components/schemas/InstanceRegion'
            type:
                $ref: '#/components/schemas/InstanceType'
            cloud_provider:
              $ref: '#/components/schemas/CloudProvider'
            tenant_id:
              type: string
              description: The project to which the instance belongs to
            memory:
              $ref: '#/components/schemas/InstanceMemory'
            storage:
              type: string
              description: Storage allocated to the instance. **This field is NOT returned for free instances**
            customer_managed_key_id:
              type: string
              description: ID of the Customer Managed Key if one was used for creating the instance
            graph_nodes:
              type: string
              description: The number of nodes in an Instance. **This field is returned ONLY for free instances**
            graph_relationships:
              type: string
              description: The number of relationships in an Instance. **This field is returned ONLY for free instances**
            vector_optimized:
              type: boolean
              description: The vector optimization configuration of the instance.
            graph_analytics_plugin:
              type: boolean
              description: The graph analytics plugin configuration of the instance.
      required:
        - data
    CustomerManagedKey:
      type: object
      description: 'Describes a Customer Managed Key'
      properties:
        data:
          properties:
            id:
              type: string
              description: The id of the key
            name:
              type: string
              description: The name of the key
            cloud_provider:
              type: string
              description: The cloud provider of the key
              enum:
                - gcp
                - aws
                - azure
            region:
              type: string
              description: The region where this key was configured for. The key will be only be available for encrypting instances in this region.
            instance_type:
              type: string
              description: The type of instances this key was configured for. Either 'enterprise-db' or 'enterprise-ds'.
              enum:
                - enterprise-db
                - enterprise-ds
            key_id:
              type: string
              description: The ID of the key in your Cloud Provider. Equal to Key ARN for AWS.
            created:
              type: string
              description: Timestamp when the key was created
            status:
              type: string
              description: The status of the key
            tenant_id:
              type: string
              description: The project to which the key belongs to
          required:
            - id
            - name
            - cloud_provider
            - region
            - instance_type
            - key_id
            - created
            - status
            - tenant_id
      required:
        - data
    InstanceSummary:
      type: object
      description: 'Summary of an Aura instance details, as returned in the get instances endpoint.'
      properties:
        id:
          type: string
          description: The id of the instance
        name:
          type: string
          description: The name of the instance
        tenant_id:
          type: string
          description: The project to which the instance belongs to
        cloud_provider:
          type: string
          description: The cloud provider of the instance
          enum:
            - gcp
            - aws
            - azure
        created_at:
          type: string
          description: The timestamp when the instance was created
      required:
        - id
        - name
        - tenant_id
        - cloud_provider
        - created_at
    InstanceRegion:
      type: string
      description: The region where the instance is hosted. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid regions for your project
    InstanceMemory:
      type: string
      description: The size of the instance memory in GB. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid sizes for your project
    InstanceStorage:
      type: string
      description: The size of the instance storage in GB. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid sizes for your project
    InstanceType:
      type: string
      enum:
        - enterprise-db
        - enterprise-ds
        - business-critical
        - professional-db
        - professional-ds
        - free-db
      description: The type of the instance. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid types for your project
    InstanceVersion:
      type: string
      description: The Neo4j version of the instance. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid versions for your project
    CloudProvider:
      type: string
      description: The cloud provider hosting the instance. Please refer to your Aura projects instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid cloud_providers for your project
      enum:
        - gcp
        - aws
        - azure
    MetricsIntegrationDetails:
      type: object
      description: 'Details about project metrics integration.'
      properties:
        data:
          type: object
          properties:
            endpoint:
              type: string
              format: uri
              description: Metrics integration endpoint URL.
          required:
            - endpoint
      required:
        - data
    GraphQLDataAPISummary:
      type: object
      description: Summary of an Aura GraphQL Data API.
      properties:
        id:
          type: string
          description: The ID of the Data API.
        name:
          type: string
          description: The name of the Data API.
        status:
          type: string
          description: The status of the Data API.
          enum:
            - creating
            - updating
            - ready
            - deleting
            - pausing
            - paused
            - resuming
            - error
        url:
          type: string
          description: The URL from which this Data API can be accessed.
      required:
        - id
        - name
        - status
        - url
    GraphQLDataAPI:
      type: object
      description: Describes an Aura GraphQL Data API.
      allOf:
        - $ref: "#/components/schemas/GraphQLDataAPISummary"
        - type: object
          properties:
            type_definitions:
              type: string
              description: Base64-encoded @neo4j/graphql type definitions. These must be compatible with version 7 of the library.
            features:
              type: object
              description: Configuration options for the Data API.
              properties:
                subgraph:
                  type: boolean
                  description: Enables the GraphQL Data API to act as a subgraph in a federated context.
              required:
                - subgraph
            security:
              type: object
              description: Security configuration options for the Data API.
              properties:
                cors_policy:
                  type: object
                  description: Configuration options for the CORS policy of the Data API.
                  properties:
                    allowed_origins:
                      type: array
                      items:
                        type: string
                      description: List of allowed origins for the Data API. These must be exact matches for the allowed origins.
                  required:
                    - allowed_origins
              required:
                - cors_policy
      required:
        - type_definitions
        - features
        - security
    GraphQLDataAPISummaryWithAuthProviders:
      allOf:
        - $ref: "#/components/schemas/GraphQLDataAPISummary"
        - type: object
          properties:
            authentication_providers:
              type: array
              items:
                $ref: "#/components/schemas/DataApiAuthProviderWithApiKey"
      required:
        - authentication_providers
    DataApiAuthProviderSummary:
      type: object
      description: Summary of an authentication provider for a Data API.
      properties:
        id:
          type: string
          description: The ID of the authentication provider.
        name:
          type: string
          description: The name of the authentication provider.
        type:
          type: string
          description: The type of the authentication provider.
          enum: [api-key, jwks]
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API.
      required:
        - id
        - name
        - type
        - enabled
    DataApiAuthProvider:
      type: object
      description: Details of an authentication provider for a Data API.
      oneOf:
        - $ref: "#/components/schemas/DataApiApiKeyAuthProvider"
        - $ref: "#/components/schemas/DataApiJwksAuthProvider"
    DataApiAuthProviderWithApiKey:
      type: object
      description: Details of a newly created authentication provider for a Data API.
      oneOf:
        - $ref: "#/components/schemas/DataApiApiKeyAuthProviderWithKey"
        - $ref: "#/components/schemas/DataApiJwksAuthProvider"
    DataApiApiKeyAuthProviderWithKey:
      description: Details of a newly created API Key authentication provider for a Data API.
      allOf:
        - $ref: "#/components/schemas/DataApiApiKeyAuthProvider"
        - type: object
          properties:
            key:
              type: string
              description: |-
                The API key that can be used to authenticate requests to the Data API. It can be provided as an x-api-key header with requests to your Data API.

                Make sure to save this key and keep it secure as it cannot be requested or changed.
      required:
        - key
    DataApiApiKeyAuthProvider:
      type: object
      description: Details of an API Key authentication provider for a Data API.
      properties:
        id:
          type: string
          description: The ID of the authentication provider.
        name:
          type: string
          description: The name of the authentication provider.
        type:
          type: string
          description: The type of the authentication provider.
          enum: [api-key]
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API.
      required:
        - id
        - name
        - type
        - enabled
    DataApiJwksAuthProvider:
      type: object
      description: Details of a JWKS authentication provider for a Data API.
      properties:
        id:
          type: string
          description: The ID of the authentication provider.
        name:
          type: string
          description: The name of the authentication provider.
        type:
          type: string
          description: The type of the authentication provider.
          enum: [jwks]
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API.
        url:
          type: string
          description: The JWKS URL that you want the bearer tokens in incoming Data API requests to be validated against.
      required:
        - id
        - name
        - type
        - enabled
        - url
    DataApiAuthProviderCreateInput:
      type: object
      description: Input for creating an authentication provider for a Data API.
      oneOf:
        - $ref: "#/components/schemas/DataApiApiKeyAuthProviderCreateInput"
        - $ref: "#/components/schemas/DataApiJwksAuthProviderCreateInput"
    DataApiApiKeyAuthProviderCreateInput:
      type: object
      description: Input for creating an API Key authentication provider for a Data API.
      properties:
        name:
          type: string
          description: The name of the authentication provider.
        type:
          type: string
          description: The type of the authentication provider.
          enum: [api-key]
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API. Default is true.
      required:
        - name
        - type
    DataApiJwksAuthProviderCreateInput:
      type: object
      description: Input for creating a JWKS authentication provider for a Data API.
      properties:
        name:
          type: string
          description: The name of the authentication provider.
        type:
          type: string
          description: The type of the authentication provider.
          enum: [jwks]
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API. Default is true.
        url:
          type: string
          description: The JWKS URL that you want the bearer tokens in incoming Data API requests to be validated against.
      required:
        - name
        - type
        - url
    DataApiApiKeyAuthProviderEditInput:
      type: object
      description: Input for editing an API Key authentication provider for a Data API.
      properties:
        name:
          type: string
          description: The name of the authentication provider.
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API.
    DataApiJwksAuthProviderEditInput:
      type: object
      description: Input for editing a JWKS authentication provider for a Data API.
      properties:
        name:
          type: string
          description: The name of the authentication provider.
        enabled:
          type: boolean
          description: Indicates if the authentication provider is allowed to access the Data API.
        url:
          type: string
          description: The JWKS URL that you want the bearer tokens in incoming Data API requests to be validated against. Only applicable for JWKS type providers.
    Error:
      type: object
      description: Used for describing one or more errors returned by an endpoint.
      title: Error
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: 'Detailed explanation of an error that has been encountered. Aimed at developers debugging issues, not recommended to be passed onto the end user.'
              reason:
                type: string
                description: The category of the error.
              field:
                type: string
                description: 'The name of the property in the request body that this error refers to, if applicable.'
            required:
              - message
              - reason
      required:
        - errors
    MiddlewareError:
      type: object
      description: |-
        Sometimes our API middleware may return an error in this format.

        The error message is an explanation of the error that has been encountered. Aimed at developers debugging issues, not recommended to be passed onto the end user.
      properties:
        error:
          type: string
          description: Error message describing the problem
  securitySchemes:
    oauthToken:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: 'https://api.neo4j.io/oauth/token'
      description: ''
  requestBodies: {}
  responses:
    PermanentRedirect:
      description: 'One of our endpoints have moved permanently, or you are attempting to access the API using HTTP.'
      headers:
        Location:
          schema:
            type: string
            format: uri-reference
          description: URI reference of the permanent new location for this resource
    BadRequest:
      description: 'The request body contains malformed syntax, or is otherwise invalid. Please check and adjust the request before attempting to send it again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The request cannot be verified as belonging to an authentic client.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    Forbidden:
      description: 'The access token has expired / been revoked, or the client does not have permissions to perform the requested action.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    InstanceNotFound:
      description: The requested instance could not be found.
      content:
        application/json:
