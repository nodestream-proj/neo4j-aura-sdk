openapi: 3.0.0
info:
  title: Aura API
  version: v2beta1
  description: |-
    This is the v2beta1 release of the Aura API.

    For more information on how to use the API, see the
    [Aura API documentation](https://neo4j.com/docs/aura/api/overview/).

    [Provide feedback](https://docs.google.com/forms/d/e/1FAIpQLSfNZMyQRnI_ZzK8IJ2E266DP_-zLDBWzk1OaUkPem16V-ekZQ/viewform)
    on the Aura API.
  termsOfService: "https://console.neo4j.io/#terms"

tags:
  - name: projects
    description: Relates to Aura Projects.
  - name: organizations
    description: Relates to Aura Organizations.
  - name: instances
    description: Relates to Aura Instances.
  - name: ip-filters
    description: Relates to Aura IP Filtering Rules.
  - name: import-jobs
    description: Relates to Import Jobs.
  - name: deployments
    description: Relates to Fleet Manager Deployments
  - name: activity-feed
    description: Relates to Activity Feed.
  - name: billing
    description: Relates to Billing.
  - name: agents
    description: Relates to Aura Agents.
  - name: users
    description: Relates to Aura Users.

servers:
  - url: "https://api.neo4j.io/v2beta1"
    description: Aura API v2beta1

paths:
  "/organizations":
    get:
      summary: Get a list of organizations
      tags:
        - organizations
      operationId: list-organizations
      description: Returns a list of Aura Organizations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationDetails"

              examples:
                Get organizations:
                  value:
                    data:
                      - id: c4ea09e5-44b2-418e-9aae-0c98c37d1f38
                        name: MetaCortex
                      - id: faaa3547-eaf8-405e-812e-e0bba04a1834
                        name: Zion
  "/organizations/{organizationId}":
    parameters:
      - $ref: "#/components/parameters/organizationId"
    get:
      summary: Get an organization by its ID
      tags:
        - organizations
      operationId: show-organization
      description: Returns information about an Aura Organization.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationDetails"

              examples:
                Get org info:
                  value:
                    data:
                      id: c4ea09e5-44b2-418e-9aae-0c98c37d1f38
                      name: MetaCortex

  "/organizations/{organizationId}/users":
    parameters:
      - $ref: "#/components/parameters/organizationId"
    get:
      summary: List all users in an organization
      tags:
        - organizations
        - users
      operationId: list-organization-users
      description: |-
        Returns a list of all users in an Aura Organization.
        Requires the caller to be an organization admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationUser"
              examples:
                List organization users:
                  value:
                    data:
                      - user_id: 9aa289f6-1ccf-57c8-bc90-a0c3cecc82ac
                        email: wiley.c@example.com
                        organization_roles:
                          - organization-admin
                        exempt_from_automatic_removal: false
                        mfa_enrollment_status: enrolled
                        mfa_enrolled_methods:
                          - id: totp
                            enrolled_at: "2025-06-15T12:00:00.000000Z"
                        last_activity_at: "2026-04-30T10:41:00.000000Z"
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden. Caller is not an organization admin.
        "404":
          description: Organization not found.
  "/organizations/{organizationId}/users/{user_id}":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/userId"
    delete:
      summary: Removes a user from an organization
      tags:
        - organizations
      operationId: show-organization
      description: Removes an Aura User from an Aura Organization.
      responses:
        "204":
          description: No Content
          content: {}
        "400":
          description: Bad request. User can not be removed.
        "401":
          description: Unauthorized. Do not have required permissions in organization.
        "403":
          description: Forbidden.

  "/organizations/{organizationId}/projects":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/status"
    get:
      summary: List projects
      tags:
        - projects
      operationId: list-projects
      description: Returns a list of projects with status active for a given Aura organization.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectDetails"

              examples:
                List projects:
                  value:
                    data:
                      - name: Operation Dark Storm
                        id: 9aa289f6-1ccf-57c8-bc90-a0c3cecc82ac

  "/organizations/{organizationId}/projects/{projectId}/instances/{instanceId}/ip-filters":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/instanceId"
    get:
      summary: Returns a list of IP filters for the organization
      tags:
        - instances
      operationId: get-instance-ip-filters
      description: |-
        Returns the IP filter with its status applied to an instance, if present.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/IpFilter"
                  - type: object
                    properties:
                      status:
                        type: string
                        description: The status of the IP filter on the instance
                        enum:
                          - UNKNOWN
                          - SUBMITTED
                          - ACTIVE
                          - DELETED
                          - ERROR

              examples:
                IP filter with Status:
                  value:
                    id: 12345678
                    name: My IP filter
                    organization_id: "example-org-id"
                    allow_list:
                      - address: "192.168.1.1"
                        prefix_len: 24
                        description: Office Network
                    filtering_disabled: false
                    filtered_entities:
                      instances: ["some-instance-id"]
                      projects: []
                      organizations: []
                    status: ACTIVE

  "/organizations/{organizationId}/ip-filters":
    parameters:
      - $ref: "#/components/parameters/organizationId"
    get:
      summary: Returns a list of IP filters for the organization
      tags:
        - ip-filters
      operationId: list-ip-filters
      description: |-
        Returns a list of IP filters of the organization.

        For an IP filter's status on individual databases please see the 
        ``/organizations/{organizationId}/projects/{projectId}/instances/{instanceId}ip-filters``
        endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IpFilter"
              examples:
                List of IP filters:
                  value:
                    - id: 12345678
                      name: My IP filter
                      organization_id: "example-org-id"
                      allow_list:
                        - address: "192.168.1.1"
                          prefix_len: 24
                          description: Office Network
                      filtering_disabled: false
                      filtered_entities:
                        instances: ["some-instance-id"]
                        projects: []
                        organizations: []
                    - id: 87654321
                      name: My Other IP filter
                      organization_id: "example-org-id"
                      allow_list:
                        - address: "192.168.1.1"
                          prefix_len: 24
                          description: Home Network
                      filtering_disabled: false
                      filtered_entities:
                        instances: ["other-id-1", "other-id-2"]
                        projects: ["project-id"]
                        organizations: []
    post:
      summary: Creates a new IP filter for the organization
      tags:
        - ip-filters
      operationId: create-ip-filter
      description: |-
        Create a new IP filter.
      requestBody:
        description: The IP filter to create.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/IpFilter"
                - type: object
                  required:
                    - name
                    - organization_id
                    - allow_list
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpFilter"
              examples:
                Created IP filter:
                  value:
                    id: 12345678
                    name: My IP filter
                    organization_id: "example-org-id"
                    allow_list:
                      - address: "192.168.1.1"
                        prefix_len: 24
                        description: Office Network
                    filtering_disabled: false
                    filtered_entities:
                      instances: ["some-instance-id"]
                      projects: []

  "/organizations/{organizationId}/ip-filters/{ipFilterId}":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/ipFilterId"
    get:
      summary: Returns a specific IP filter of the organization
      tags:
        - ip-filters
      operationId: get-ip-filter
      description: |-
        Returns a specific IP filter by its ID.

        For an IP filter's status on individual instances see the 
        ``/organizations/{organizationId}/projects/{projectId}/instances/{instanceId}ip-filters``
        endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpFilter"
              examples:
                Specific IP filters:
                  value:
                    id: 12345678
                    name: My IP filter
                    organization_id: "example-org-id"
                    allow_list:
                      - address: "192.168.1.1"
                        prefix_len: 24
                        description: Office Network
                    filtering_disabled: false
                    filtered_entities:
                      instances: ["some-instance-id"]
                      projects: []
                      organizations: []
    patch:
      summary: Updates an existing IP filter
      tags:
        - ip-filters
      operationId: update-ip-filter
      requestBody:
        description: The IP filter to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpFilter"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpFilter"
              examples:
                Updated IP filter:
                  value:
                    id: 12345678
                    name: My IP filter
                    organization_id: "example-org-id"
                    allow_list:
                      - address: "192.168.1.1"
                        prefix_len: 24
                        description: Office Network
                    filtering_disabled: false
                    filtered_entities:
                      instances: ["some-instance-id"]
                      projects: []
    delete:
      summary: Deletes an existing IP filter
      tags:
        - ip-filters
      operationId: delete-ip-filter
      responses:
        "204":
          description: No Content
          content: {}

  "/organizations/{organizationId}/projects/{projectId}/import/jobs":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/projectId"
    post:
      summary: Create a new import job
      tags:
        - import-jobs
      operationId: create-import-job
      description: |-
        Create a new import job by the specified import model ID, Aura instance ID and optional Aura credentials.
        The model ID can be found in the URL as such `console-preview.neo4j.io/tools/import/model/<model ID>`.
      requestBody:
        description: The import job creation request.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportJobRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdEnvelope"
              examples:
                Created import job:
                  value:
                    data:
                      id: "87d485b4-73fc-4a7f-bb03-720f4672947e"

  "/organizations/{organizationId}/projects/{projectId}/import/jobs/{jobId}":
    parameters:
      - $ref: "#/components/parameters/organizationId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/jobId"
