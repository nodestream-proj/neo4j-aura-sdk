      tags:
        - import-jobs
      operationId: get-import-job
      description: |-
        Retrieves a single job details by its ID.
      parameters:
        - name: progress
          in: query
          required: false
          schema:
            type: boolean
          description: |-
            Whether to include progress details for nodes and relationships.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobEnvelope"
              examples:
                Without progress details:
